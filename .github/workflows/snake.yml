name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"      # daily at 00:00 UTC
  workflow_dispatch:          # manual run from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write             # only needed to push the output branch

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVG (cyberpunk palette)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=#FCEE0A&color_dots=#141B33,#0B4F6C,#00A3B4,#00F0FF,#FF2A6D
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # snk SVGs are transparent; add a dark background so the grid looks identical in GitHub light and dark themes
      - name: Add dark background
        run: |
          f=dist/github-contribution-grid-snake-dark.svg
          sed -i -E '0,/<svg[^>]*>/s//&<rect x="-50" y="-50" width="5000" height="5000" fill="#0A0E1A"\/>/' "$f"
          grep -c '#0A0E1A' "$f"

      - name: Publish to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
